services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # NO ports: - Coolify gestisce il proxy
    environment:
      # Auto-generati da Coolify magic variables
      - BETTER_AUTH_SECRET=$SERVICE_BASE64_64_AUTH
      - NEXT_PUBLIC_APP_URL=$SERVICE_URL_APP

      # Database - Coolify sostituisce le variabili
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-auth_app}
      - DB_USER=$SERVICE_USER_POSTGRESQL
      - DB_PASSWORD=$SERVICE_PASSWORD_POSTGRESQL

      # Editabili manualmente nell'UI Coolify
      - NODE_ENV=${NODE_ENV:-production}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    environment:
      # Auto-generati da Coolify magic variables
      - POSTGRES_USER=$SERVICE_USER_POSTGRESQL
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRESQL
      - POSTGRES_DB=${POSTGRES_DB:-auth_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # NO ports: - comunicazione interna via nome servizio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_app"]
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # NO ports: - Coolify gestisce il proxy
    environment:
      # Auto-generati da Coolify magic variables
      - BETTER_AUTH_SECRET=$SERVICE_BASE64_64_AUTH
      - NEXT_PUBLIC_APP_URL=$SERVICE_URL_APP

      # Database - usa ${VAR} per passare come ARG al build
      - DB_HOST=${DB_HOST:-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-auth_app}
      - DB_USER=$SERVICE_USER_POSTGRESQL
      - DB_PASSWORD=$SERVICE_PASSWORD_POSTGRESQL

      # Editabili manualmente nell'UI Coolify
      - NODE_ENV=${NODE_ENV:-production}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    # NO ports: - comunicazione interna via nome servizio (Coolify gestisce il proxy)
    environment:
      # Auto-generati da Coolify magic variables
      - POSTGRES_USER=$SERVICE_USER_POSTGRESQL
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRESQL
      - POSTGRES_DB=${POSTGRES_DB:-auth_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # NO ports: - comunicazione interna via nome servizio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-auth_app}"]
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    # NO ports: - Coolify gestisce il proxy e assegna dominio
    environment:
      # Email editabile, password auto-generata da Coolify
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=$SERVICE_PASSWORD_PGADMIN
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
